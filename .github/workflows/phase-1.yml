name: Catalogue demo and migrations
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: demo
          POSTGRES_PASSWORD: demo
          POSTGRES_DB: catalog_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U demo -d catalog_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: pip install uv==0.12.23
      - run: uv sync --locked
      - run: npm ci --prefix apps/web
      - run: npm run build --prefix apps/web
      - run: .venv/bin/pytest tests/test_api.py tests/test_auth.py tests/test_migrations.py tests/test_public_url.py -q
      - run: .venv/bin/playwright install --with-deps chromium
      - name: Run live OIDC browser tests
        env:
          BROWSER_BASE_URL: http://localhost:8000
        run: |
          # Unit/integration PostgreSQL service owns 5432; only the live Compose DB uses a different host port.
          cat > /tmp/compose-browser.yaml <<'YAML'
          services:
            db:
              ports: !override
                - "127.0.0.1:5433:5432"
          YAML
          export COMPOSE_FILE=compose.yaml:/tmp/compose-browser.yaml
          docker compose up --build -d --wait
          trap 'docker compose logs app keycloak; docker compose down' EXIT
          .venv/bin/pytest tests/test_browser.py -q
