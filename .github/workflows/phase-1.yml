name: Phase 1 demo
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: demo
          POSTGRES_PASSWORD: demo
          POSTGRES_DB: catalog_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U demo -d catalog_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: pip install uv==0.12.23
      - run: uv sync --locked
      - run: npm ci --prefix apps/web
      - run: npm run build --prefix apps/web
      - run: .venv/bin/pytest tests/test_api.py tests/test_public_url.py -q
      - run: .venv/bin/playwright install --with-deps chromium
      - name: Run live browser tests
        env:
          DEMO_MODE: 'true'
          DATABASE_URL: postgresql+psycopg://demo:demo@localhost:5432/catalog_test
          BROWSER_BASE_URL: http://127.0.0.1:8000
        run: |
          .venv/bin/uvicorn apps.api.main:app --host 127.0.0.1 --port 8000 > /tmp/api.log 2>&1 &
          API_PID=$!
          trap 'kill "$API_PID"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail http://127.0.0.1:8000/health/ready; then break; fi
            sleep 1
          done
          .venv/bin/pytest tests/test_browser.py -q
      - run: docker build -t metatietovaranto-app .

