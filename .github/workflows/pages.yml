name: Public Pages demo
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deployment' }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: pip install uv==0.12.23
      - run: uv sync --locked
      - run: npm ci --prefix apps/web
      - run: bash scripts/build-pages.sh
      - run: uv run --locked playwright install --with-deps chromium
      - run: uv run --locked pytest tests_static -q
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist-pages
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Verify published HTTP responses
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 5 "$PAGES_URL" --output /tmp/pages.html
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 5 "${PAGES_URL%/}/demo/catalog.json" --output /tmp/pages-catalog.json
          python - <<'PY'
          import json
          from pathlib import Path
          assert '<div id="root"></div>' in Path('/tmp/pages.html').read_text()
          data=json.loads(Path('/tmp/pages-catalog.json').read_text())
          assert data['synthetic'] is True and len(data['items'])==4
          assert all(item['synthetic'] is True for item in data['items'])
          PY
