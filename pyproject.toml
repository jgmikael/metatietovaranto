[project]
name = "metatietovaranto"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.16,<2",
    "httpx>=0.28,<1",
    "pyjwt[crypto]>=2.10,<3",
    "rdflib>=7,<8",
    "pyshacl>=0.31,<0.32",
    "jsonschema>=4.23,<5",
    "openapi-spec-validator>=0.7,<0.8",
    "openapi-schema-validator>=0.6,<0.7",
    "pyld>=2.0.4,<3",
]
[dependency-groups]
dev = [
    "pytest>=8,<10",
    "playwright>=1.50,<2",
]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
